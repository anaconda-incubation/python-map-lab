<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Social card: dark atlas ground, parchment globe mid-morph into a
       ruled flat map, title in serif, vermilion accent rule (design.md §11). -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1E3F60" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E3F60" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="half"><rect x="0" y="0" width="600" height="630"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#0E1216"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- globe mid-morph: left hemisphere sphere, right side unrolled grid -->
  <g transform="translate(600, 285)">
    <circle cx="0" cy="0" r="150" fill="#17324E"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#EDE6D6" stroke-opacity="0.55" stroke-width="1"/>
    <!-- sphere graticule (ellipses) -->
    <g stroke="#EDE6D6" stroke-opacity="0.28" stroke-width="0.8" fill="none">
      <ellipse cx="0" cy="0" rx="150" ry="40"/>
      <ellipse cx="0" cy="0" rx="150" ry="95"/>
      <ellipse cx="0" cy="0" rx="40" ry="150"/>
      <ellipse cx="0" cy="0" rx="95" ry="150"/>
      <line x1="-150" y1="0" x2="150" y2="0"/>
      <line x1="0" y1="-150" x2="0" y2="150"/>
    </g>
    <!-- unrolled rectangle emerging to the right -->
    <g transform="translate(150, 0)">
      <rect x="0" y="-120" width="240" height="240" fill="#16222E"/>
      <rect x="0" y="-120" width="240" height="240" fill="none" stroke="#EDE6D6" stroke-opacity="0.55" stroke-width="1"/>
      <g stroke="#EDE6D6" stroke-opacity="0.28" stroke-width="0.8">
        <line x1="0" y1="-60" x2="240" y2="-60"/>
        <line x1="0" y1="0" x2="240" y2="0"/>
        <line x1="0" y1="60" x2="240" y2="60"/>
        <line x1="60" y1="-120" x2="60" y2="120"/>
        <line x1="120" y1="-120" x2="120" y2="120"/>
        <line x1="180" y1="-120" x2="180" y2="120"/>
      </g>
      <!-- morph bridge lines -->
      <g stroke="#C2481F" stroke-opacity="0.85" stroke-width="1">
        <line x1="-150" y1="-60" x2="0" y2="-60"/>
        <line x1="-150" y1="0" x2="0" y2="0"/>
        <line x1="-150" y1="60" x2="0" y2="60"/>
      </g>
    </g>
  </g>

  <!-- title -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#EDE6D6">
    <text x="600" y="520" text-anchor="middle" font-size="56" letter-spacing="2">EVERY FLAT MAP</text>
    <text x="600" y="582" text-anchor="middle" font-size="56" letter-spacing="2" font-style="italic">IS A CHOICE</text>
  </g>
  <rect x="480" y="470" width="240" height="2" fill="#C2481F"/>
  <text x="600" y="92" text-anchor="middle" font-family="Georgia, serif" font-size="17"
    letter-spacing="5" fill="#9C9482">AN INTERACTIVE ESSAY ON MAP PROJECTIONS</text>
</svg>
